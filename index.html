<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/CSS/style.css">
</head>
<body>
    <header>
        <nav>
            <h1><span>D</span>GAMES</h1>
            <div class="div-btn-categorias">
                <button id="btn-todos" class="btn-categorias">Todos</button>
                <button id="btn-notebooks" class="btn-categorias">Notebooks</button>
                <button id="btn-celulares" class="btn-categorias">Celulares</button>
                <button id="btn-videogames" class="btn-categorias">Videogames</button>
            </div>
            <div class="barra-pesquisa">
                <button id="btn-carrinho">
                    <i><img src="./src/assets/icons/carrinho.png" alt="Carrinho"></i>
                </button>

                <form method="GET">
                    <input type="search" name="pesquisa" id="pesquisa" placeholder="Pesquisar">
                </form>
                <i class="search-icon"><img src="./src/assets/icons/pesquisa.png" alt="Pesquisa"></i>
            </div>
        </nav>
    </header>

    <main>
        <section class="cards"></section>
        <section id="section-carrinho">
            <button id="fechar-carrinho-btn"><img src="./src/assets/icons/fecharCarrinho.png" alt="Fechar carrinho"></button>
            <ul id="lista-carrinho"></ul>
            <p id="p-preco-carrinho">Preço total: <span id="preco-total-carrinho"></span></p>
            <button id="esvaziar-carrinho-btn">Esvaziar carrinho</button>
        </section>
    </main>
    <script src="./src/JS/script.js"></script>
</body>
</html>
